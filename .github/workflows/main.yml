# Blue Gamba — Minecraft 1.21.11 (Fabric)

Blue Gamba ist eine clientseitige Demo-Slotmaschine mit blauem GUI, 3×3 Erz-Walzen und lokalem Demoguthaben.

## Funktionen

- Taste G öffnet das Menü (unter Optionen → Steuerung anpassbar).
- Blaue Chest-inspirierte Oberfläche mit drei Walzen und einer markierten mittleren Gewinnreihe.
- Drehzeit zufällig zwischen 2 und 4 Sekunden.
- Einsätze müssen ganzzahlig und größer als 0 sein und dürfen das Guthaben nicht überschreiten.
- Ungültige Einsätze werden abgelehnt und im GUI/Chat gemeldet.
- Nur drei gleiche Symbole in der mittleren Reihe zahlen aus.
- Demoguthaben startet bei 1.000 Coins und wird lokal unter config/bluegamba.properties gespeichert.

## Multiplikatoren

| Drei gleiche Symbole | Auszahlung |
|---|---:|
| Kohleerz | 0,5x |
| Eisenerz | 1,2x |
| Golderz | 2,0x |
| Diamanterz | 5,0x |
| Smaragderz | 10,0x |
| Ancient Debris | 25,0x |

Der Multiplikator beschreibt die Gesamtauszahlung inklusive Einsatz.
Beispiel: 100 Coins Einsatz und drei Diamanterze zahlen 500 Coins aus; der Nettogewinn beträgt +400 Coins. Bei drei Kohleerzen werden 50 Coins ausgezahlt; der Nettverlust beträgt 50 Coins. Bei keinem Drilling geht der ganze Einsatz verloren. Auszahlungen werden auf ganze Coins gerundet.

## Projektstruktur

Jede Datei muss getrennt am angegebenen Pfad liegen. Kopiere nicht den kompletten Projekttext in main.yml. In .github/workflows/main.yml darf ausschließlich der YAML-Workflow stehen. settings.gradle, build.gradle, gradle.properties, Java-Dateien und JSON-Dateien gehören in ihre jeweils eigenen Dateien.

## Versionen und Voraussetzungen

- Minecraft Java Edition 1.21.11
- Java JDK 21
- Fabric Loader 0.18.1 oder neuer
- Fabric API passend für Minecraft 1.21.11
- Gradle 8.14.3
- Fabric Loom 1.14.10

## Lokal bauen

1. Installiere JDK 21 und Gradle 8.14.3.
2. Öffne ein Terminal im Projekt-Hauptordner, in dem settings.gradle und build.gradle liegen.
3. Führe gradle build --no-daemon aus.
4. Bei Erfolg liegt die Mod-JAR unter build/libs/bluegamba-1.0.0.jar.
5. Kopiere die JAR und die passende Fabric API in den .minecraft/mods-Ordner.

## GitHub Build

1. Lade die Dateien und Ordner aus diesem ZIP in den Hauptordner des GitHub-Repositorys.
2. Ersetze die bisherige fehlerhafte .github/workflows/main.yml und verwende die Datei main.yml aus diesem Projekt.
3. Committe und pushe die Änderungen.
4. Öffne den Reiter Actions. Der Workflow baut das Projekt und stellt bei Erfolg bluegamba-mod unter Artifacts bereit.

## Einschränkung

Das ist eine clientseitige Demo. Guthaben wird lokal gespeichert und nicht zwischen Spielern oder auf einem Server synchronisiert. Der Quellcode wurde nicht gegen die externen Minecraft/Fabric-Abhängigkeiten kompiliert.


