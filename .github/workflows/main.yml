# GitHub-Fix für den Fehler „Invalid workflow file“

Deine bisherige .github/workflows/main.yml enthielt den ganzen Projekttext. GitHub erwartet dort ausschließlich YAML.

1. Lade diese korrigierte ZIP herunter und entpacke sie.
2. Kopiere alle Dateien und Ordner aus dem entpackten Projekt direkt in den Hauptordner deines geklonten bluegamba-Repositorys.
3. Überschreibe Dateien bei Nachfrage. Achte besonders darauf, dass .github/workflows/main.yml überschrieben wird.
4. Die korrekte main.yml beginnt mit name: Build Blue Gamba und enthält nur Workflow-YAML.
5. Committe und pushe die Dateien.
6. Öffne GitHub → Actions. Der Build sollte starten.

Nicht den Text aller Dateien als eine einzelne Datei hochladen. Jede Datei muss an ihrem Pfad separat existieren.


