package de.bluegamba;

import com.mojang.blaze3d.platform.InputConstants;
import net.fabricmc.api.ClientModInitializer;
import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
import net.minecraft.client.KeyMapping;
import net.minecraft.resources.Identifier;
import org.lwjgl.glfw.GLFW;

public final class BlueGambaClient implements ClientModInitializer {

    private static final KeyMapping.Category CATEGORY =
            KeyMapping.Category.register(
                    Identifier.fromNamespaceAndPath(
                            "bluegamba",
                            "controls"
                    )
            );

    private static final KeyMapping OPEN_KEY =
            KeyBindingHelper.registerKeyBinding(
                    new KeyMapping(
                            "key.bluegamba.open",
                            InputConstants.Type.KEYSYM,
                            GLFW.GLFW_KEY_G,
                            CATEGORY
                    )
            );

    @Override
    public void onInitializeClient() {
        GambaAccount.load();

        ClientTickEvents.END_CLIENT_TICK.register(client -> {
            while (OPEN_KEY.consumeClick()) {
                if (client.player != null && client.screen == null) {
                    client.setScreen(new GambaScreen());
                }
            }
        });

        System.out.println(
                "[Blue Gamba] Client-Mod geladen. Taste G oeffnet die Slotmaschine."
        );
    }
}


